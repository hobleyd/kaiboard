name: kAIboard
options:
  bundleIdPrefix: au.com.sharpblue
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 69XRMYD9XG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # The Rust engine (core/) is linked into both targets as a static library.
    SWIFT_OBJC_BRIDGING_HEADER: core/include/kaiboard_core.h
    OTHER_LDFLAGS: -lkaiboard_core
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/core/target/aarch64-apple-ios/release
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/core/target/aarch64-apple-ios-sim/release
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  kAIboard:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: kAIboardKeyboard
    preBuildScripts:
      - name: Build Rust engine
        script: '"$PROJECT_DIR/scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.sharpblue.kaiboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release is what CI archives for TestFlight: it signs with the
        # distribution certificate and App Store profile the workflow imports.
        # Debug keeps automatic signing for building to a device from Xcode.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: kAIboard App Store
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: kAIboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  kAIboardKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    preBuildScripts:
      - name: Build Rust engine
        script: '"$PROJECT_DIR/scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.sharpblue.kaiboard.keyboard
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: kAIboard Keyboard App Store
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: kAIboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Everything runs on the device, so the keyboard never needs
            # network or shared-container access.
            RequestsOpenAccess: false
