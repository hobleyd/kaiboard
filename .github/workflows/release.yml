name: kaiboard-release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the Rust engine
        working-directory: core
        run: cargo test

  # Compiles both targets for a device without signing, so a pull request shows
  # whether the app still builds on a clean machine.
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
      - run: xcodegen generate
      - name: Build
        run: >
          xcodebuild build
          -project kAIboard.xcodeproj -scheme kAIboard -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  # Uploads to TestFlight only; handing builds to testers is an App Store
  # Connect setting. Push-only, because pull requests don't get the secrets.
  testflight:
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Fail here, by name, rather than deep inside codesign or altool.
      - name: Check signing secrets
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          IOS_KEYBOARD_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_KEYBOARD_PROVISIONING_PROFILE_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD KEYCHAIN_PASSWORD IOS_PROVISIONING_PROFILE_B64 \
                      IOS_KEYBOARD_PROVISIONING_PROFILE_B64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
      - run: xcodegen generate

      # Same shape as nightmail's iOS job (create keychain -> import .p12 ->
      # place the profiles by UUID), with a second App Store profile because
      # the keyboard extension has its own bundle ID.
      - name: Import distribution certificate and provisioning profiles
        env:
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          KEYBOARD_PROFILE_B64: ${{ secrets.IOS_KEYBOARD_PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          echo "$IOS_DIST_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/ios_cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/ios_cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            echo "$1" | base64 --decode > "$RUNNER_TEMP/$2.mobileprovision"
            uuid=$(security cms -D -i "$RUNNER_TEMP/$2.mobileprovision" | plutil -extract UUID raw -)
            cp "$RUNNER_TEMP/$2.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          }
          install_profile "$APP_PROFILE_B64" app
          install_profile "$KEYBOARD_PROFILE_B64" keyboard

      # The Release configuration in project.yml already asks for manual
      # signing with these profiles, so nothing needs patching here. The run
      # number is the build number: TestFlight refuses a (version, build) pair
      # it has seen before, and this one rises on every run.
      - name: Archive
        run: >
          xcodebuild archive
          -project kAIboard.xcodeproj -scheme kAIboard -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/kAIboard.xcarchive"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export the .ipa
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/kAIboard.xcarchive"
          -exportOptionsPlist ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"

      # altool reads the API key from this fixed path by Key ID. `--upload-app`
      # maps the .ipa's bundle ID onto an existing App Store Connect app
      # record; it does not create one.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA_PATH=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
